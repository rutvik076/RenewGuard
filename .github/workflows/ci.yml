name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore RenewGuard.slnx
      - run: dotnet build RenewGuard.slnx -c Release --no-restore
      - run: dotnet test RenewGuard.slnx -c Release --no-build
      - run: docker build -t renewguard-api .
